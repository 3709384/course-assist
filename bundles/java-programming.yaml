# 课程包（draft）：JDK 四个版本可选，winget 包 ID 待维护者实机验证后升级为 verified。
id: java-programming
name: Java 程序设计
category: programming
summary: JDK（8/11/17/21 可选）+ 编辑器 + Maven，装完自动配好 JAVA_HOME。
status: draft
tools:
  - name: JDK
    purpose: Java 开发工具包：编译、运行 Java 程序。按课程要求选版本，不确定选推荐的 17
    required: true
    default_version: "17"
    versions:
      - label: "8"
        winget: EclipseAdoptium.Temurin.8.JDK
        verify:
          command: java -version
          expect: '1\.8\.'
      - label: "11"
        winget: EclipseAdoptium.Temurin.11.JDK
        verify:
          command: java -version
          expect: '11\.'
      - label: "17"
        winget: Microsoft.OpenJDK.17
        verify:
          command: java -version
          expect: '17\.'
      - label: "21"
        winget: Microsoft.OpenJDK.21
        verify:
          command: java -version
          expect: '21\.'
    env:
      JAVA_HOME: "{install_dir}"
      path_additions: ["{install_dir}\\bin"]
  - name: IntelliJ IDEA Community
    purpose: 写 Java 代码的主力编辑器（社区版免费）
    winget: JetBrains.IntelliJIDEA.Community
    required: true
  - name: VS Code
    purpose: 轻量替代编辑器：习惯轻量编辑器或电脑配置较低时选它（与 IDEA 二选一即可）
    winget: Microsoft.VisualStudioCode
    required: false
  - name: Apache Maven
    purpose: Java 项目构建与依赖管理（高年级课程与实训常用）
    winget: Apache.Maven
    required: false
    verify:
      command: mvn -version
      expect: 'Apache Maven'
  - name: Git
    purpose: 版本管理：交作业、拉老师代码、做团队项目都要用
    winget: Git.Git
    required: false
    verify:
      command: git --version
      expect: 'git version'
notes: 部分学校课程指定 JDK 8 或 11，安装时在版本列表里选对应版本即可；多个 JDK 版本可以共存，默认版本由 JAVA_HOME 指向决定。
